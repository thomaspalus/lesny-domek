<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Leśny Domek – gra 3D</title>
<meta name="version" content="0.0.59">
<meta name="author" content="Tomasz Palus">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d2a1a;font-family:'Baloo 2',system-ui,sans-serif;color:#fff4dc;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 8px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 8px)}
#ui>*{pointer-events:auto}
body.inmenu #ui{display:none}
#top{display:flex;gap:6px;align-items:flex-start}
#inv{flex:1;display:flex;flex-wrap:nowrap;gap:3px;overflow-x:auto;scrollbar-width:none}#inv::-webkit-scrollbar{display:none}
.chip{flex:1 1 0;min-width:0;max-width:56px;background:rgba(35,24,14,.72);border:1.5px solid rgba(255,214,150,.3);border-radius:10px;padding:2px 0 1px;font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:40px;line-height:1}
.chip .ce{font-size:17px;line-height:1}.chip .ce .ico{width:17px;height:17px;vertical-align:0}
.chip.zero{opacity:.45}
.ico{width:1.2em;height:1.2em;vertical-align:-.22em;display:inline-block}
.chip.bump{animation:bump .45s}
@keyframes bump{50%{transform:scale(1.3);background:#ffb347;color:#3a2410}}
.rbtns{display:flex;gap:5px}
.rbtn{width:40px;height:40px;border-radius:12px;border:2px solid rgba(255,214,150,.45);background:rgba(35,24,14,.8);font-size:20px;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
#hint{transition:opacity .6s;margin-top:4px;font-size:13.5px!important;padding:3px 10px!important;align-self:center;max-width:560px;background:rgba(255,248,230,.94);color:#4a2c12;border-radius:14px;padding:4px 12px;font-size:15px;font-weight:600;line-height:1.25;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#hint:empty{display:none}
#hint.fade{opacity:0;pointer-events:none}
#spacer{flex:1;pointer-events:none}
#panel{align-self:center;width:100%;max-width:560px;background:rgba(43,29,17,.82);border:2px solid #c89b5e;border-radius:16px;padding:5px 8px;margin-bottom:5px;max-height:44vh;overflow:auto;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#panel:empty{display:none}
.ttl{font-size:17px;font-weight:700;text-align:center;margin-bottom:4px}
.ttl b{color:#ffd27a}
.ttl span{color:#ffd27a}
.prow{display:flex;gap:8px;align-items:center}.pinfo{flex:1;min-width:0}.pinfo .ttl{text-align:left;margin:0 0 2px}.pinfo .nds{justify-content:flex-start}
.pbtn{flex:0 0 auto;font-family:inherit;font-size:17px;font-weight:800;color:#3a1d05;border:none;border-radius:14px;padding:9px 13px;background:linear-gradient(#ffd27a,#ff9a2e);box-shadow:0 4px 0 #b35e10;touch-action:manipulation;white-space:nowrap}
.pbtn:active,.pbtn.hit{transform:translateY(3px);box-shadow:0 1px 0 #b35e10}.pbtn.green{background:linear-gradient(#bff08d,#5fbf3a);box-shadow:0 4px 0 #367a1d}.pbtn:disabled{background:#8d7f6c;box-shadow:0 4px 0 #5c5144;color:#e7dccb}.pbtn.big2{font-size:20px;padding:12px 18px}
.big{display:block;width:100%;font-family:inherit;font-size:19px;font-weight:800;color:#3a1d05;border:none;border-radius:14px;padding:7px 10px;background:linear-gradient(#ffd27a,#ff9a2e);box-shadow:0 5px 0 #b35e10;margin-top:4px;touch-action:manipulation}
.big:active,.big.hit{transform:translateY(3px);box-shadow:0 2px 0 #b35e10}
.big:disabled{background:#8d7f6c;box-shadow:0 5px 0 #5c5144;color:#e7dccb}
.big.green{background:linear-gradient(#bff08d,#5fbf3a);box-shadow:0 5px 0 #367a1d}
.big.blue{background:linear-gradient(#bfe4ff,#5aa9e6);box-shadow:0 5px 0 #2a6aa0}
.big.held{background:linear-gradient(#ffb36b,#ff5a1f);transform:translateY(3px);box-shadow:0 2px 0 #9b3a0a}
.row{display:flex;gap:6px}
.row .big{flex:1;font-size:17px}
.meter{position:relative;height:20px;border-radius:10px;overflow:hidden;border:3px solid #fff4dc;margin:4px 0}
.meter .z{position:absolute;inset:0}
.meter i{position:absolute;top:-3px;bottom:-3px;width:6px;margin-left:-3px;background:#fff;border:2px solid #222;border-radius:3px;left:0}
.mlab{display:flex;justify-content:space-between;font-size:11px;font-weight:700;opacity:.9}
.bar{height:18px;border-radius:9px;background:#3a2a1a;border:2px solid #fff4dc;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff6a00)}
.stars{font-size:26px;text-align:center;letter-spacing:3px;line-height:1.1}
.ttl.sm{font-size:15px;margin-bottom:3px}.ttl.sm span{color:#e8d6b8;font-size:12px;font-weight:600}
.srow{display:flex;gap:6px;align-items:stretch}
.strip{flex:1;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px 0}.strip::-webkit-scrollbar{display:none}
.sbtn{flex:0 0 auto;width:54px;height:54px;border-radius:12px;border:3px solid transparent;background:#f6e7c8;color:#4a2c12;font-family:inherit;font-size:23px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0}
.sbtn small{font-size:9.5px;font-weight:800;margin-top:3px;white-space:nowrap}
.sbtn.on{border-color:#5fbf3a;background:#dff7cf}
.sbtn.wide{width:66px}
.dgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.dgrid .sbtn{width:auto;height:50px;font-size:21px}.dgrid .sbtn small{font-size:8.5px}.dgrid .gob{border-radius:12px;font-size:12px;padding:0 2px}
.gob{flex:0 0 auto;border:none;border-radius:12px;font-family:inherit;font-weight:800;font-size:14px;color:#1f3a0c;background:linear-gradient(#bff08d,#5fbf3a);box-shadow:0 3px 0 #367a1d;padding:0 9px;line-height:1.1}
.opt{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid transparent;border-radius:12px;background:#f6e7c8;color:#4a2c12;font-family:inherit;font-size:15px;font-weight:800;padding:4px 3px;box-shadow:0 3px 0 #b08a55}
.opt:disabled{opacity:.7}.opt:not(:disabled){border-color:#5fbf3a}
.nd{cursor:pointer;font-size:12px;font-weight:800;color:#4a2c12;padding:0 4px;border-radius:6px;background:#f3cfc4;white-space:nowrap}.nd.ok{background:#c9f0b4}
.nds{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.msg{text-align:center;font-size:17px;font-weight:700}
#tools{align-self:center;width:100%;max-width:560px;display:flex;gap:4px;background:rgba(43,29,17,.82);border:2px solid #c89b5e;border-radius:16px;padding:4px}
body.notools #tools{display:none}
.tool{flex:1;min-width:0;height:50px;border-radius:12px;border:3px solid transparent;background:#f6e7c8;font-size:23px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0;font-family:inherit;transition:transform .12s}
.tool small{font-size:9px;color:#5a3a1a;font-weight:800;margin-top:3px}
.tool.on{border-color:#ffcc33;background:#fff7d6;transform:translateY(-3px);box-shadow:0 3px 0 #b8860b}
.tool.pulse{animation:pulse .5s 4}
@keyframes pulse{50%{transform:scale(1.18);background:#ffe066;border-color:#ff7a1a}}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.16);border:3px solid rgba(255,255,255,.55);pointer-events:none;display:none;z-index:4}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,244,220,.9);box-shadow:0 2px 6px rgba(0,0,0,.4)}
#floaters{position:fixed;inset:0;pointer-events:none;z-index:5}
.float{position:fixed;transform:translate(-50%,-50%);font-weight:800;font-size:24px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 8px #000;animation:fl 1.3s forwards;white-space:nowrap}
@keyframes fl{to{transform:translate(-50%,-160%);opacity:0}}
#toast{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%) scale(.8);background:rgba(255,248,230,.97);color:#4a2c12;border-radius:16px;padding:8px 16px;font-weight:700;font-size:17px;max-width:88vw;text-align:center;opacity:0;transition:all .25s;pointer-events:none;z-index:6;box-shadow:0 6px 20px rgba(0,0,0,.35);border:3px solid #ffb347}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast.tip{border-color:#69b44a;background:#f0fbe6}
.overlay{position:fixed;inset:0;display:none;z-index:10;align-items:flex-end;justify-content:center;padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 10px)}
.overlay.show{display:flex}
#modal{align-items:center;background:rgba(10,15,30,.45)}
.card{width:100%;max-width:520px;background:rgba(43,29,17,.93);border:3px solid #c89b5e;border-radius:22px;padding:12px 14px;max-height:80vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.card h1{margin:0;text-align:center;font-size:32px;line-height:1.1;color:#ffd27a;text-shadow:0 3px 0 #6b3a10}
.card h2{margin:0 0 4px;text-align:center;font-size:26px;color:#ffd27a}
.sub{text-align:center;margin:2px 0 6px;font-size:15px;opacity:.95}
.lbl{font-weight:800;font-size:14px;color:#ffd27a;margin:6px 0 3px;text-transform:uppercase;letter-spacing:.5px}
.opts{display:flex;gap:8px}
.opts button{flex:1;font-family:inherit;border:3px solid transparent;border-radius:16px;background:#f6e7c8;color:#4a2c12;padding:6px;font-size:30px;line-height:1.1;box-shadow:0 4px 0 #b08a55}
.opts button b{display:block;font-size:15px}
.opts button.on{border-color:#ff9a2e;background:#fff3cf}
.ver{text-align:center;font-size:12px;opacity:.7;margin-top:6px}
.big.ghost{background:rgba(255,255,255,.12);color:#fff4dc;box-shadow:none;border:2px solid rgba(255,214,150,.5);font-size:16px;padding:6px}
.lic{font-size:13px;line-height:1.4;text-align:left}
.lic h3{color:#ffd27a;font-size:15px;margin:10px 0 2px}
.lic p{margin:3px 0}
.lic pre{white-space:pre-wrap;font-size:10.5px;background:rgba(0,0,0,.3);border-radius:8px;padding:6px;margin:4px 0;font-family:ui-monospace,monospace;user-select:text;-webkit-user-select:text}
.lic ul{margin:3px 0;padding-left:18px}
.lic a{color:#9fd3ff}
.tgs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}.tg{font-family:inherit;font-size:15px;font-weight:800;color:#fff4dc;background:rgba(255,255,255,.12);border:2px solid rgba(255,214,150,.5);border-radius:14px;padding:9px 4px}.tg:active{background:rgba(255,214,150,.3)}

/* ---------- układ: dół ekranu ---------- */
#bottom{display:flex;flex-direction:column;align-items:center;width:100%}
/* telefon w poziomie (niska wysokość) */
@media (orientation:landscape) and (max-height:540px){
  #ui{padding-top:calc(env(safe-area-inset-top) + 4px);padding-bottom:calc(env(safe-area-inset-bottom) + 4px)}
  #bottom{flex-direction:row;align-items:flex-end;justify-content:center;gap:6px;max-width:980px;align-self:center}
  #panel{flex:1;margin-bottom:0;max-height:52vh;min-width:0}
  #tools{width:auto;flex:0 0 auto}.tool{flex:0 0 auto;width:54px;height:50px}
  .chip{height:34px;max-width:52px}.rbtn{width:34px;height:34px;font-size:17px}
  #menu{align-items:center}
  .mcard{max-width:780px;max-height:92vh;padding:10px 14px}
  .mgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:center}
  .mcard h1{font-size:26px}.mcard .sub{font-size:13px}.opts button{font-size:24px;padding:4px}.opts button b{font-size:13px}
  .mcard   #modal .card{max-height:92vh}
}
/* tablet i komputer w poziomie */
@media (orientation:landscape) and (min-height:541px) and (min-width:900px){
  #bottom{flex-direction:row;align-items:flex-end;justify-content:center;gap:8px;max-width:1040px;align-self:center}
  #panel{flex:1;margin-bottom:0;max-width:640px;min-width:0}
  #tools{width:auto;flex:0 0 auto}.tool{flex:0 0 auto;width:64px}
  #menu{align-items:center}
  .mcard{max-width:880px}
  .mgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center}
}
/* większe ekrany (tablet w pionie i w poziomie, komputer) – większe przyciski */
@media (min-width:700px) and (min-height:700px){
  .chip{height:46px;max-width:64px;font-size:14px}.chip .ce{font-size:21px}.chip .ce .ico{width:21px;height:21px}
  .rbtn{width:46px;height:46px;font-size:24px}
  #panel,#tools{max-width:640px}
  .tool{height:62px;font-size:29px}.tool small{font-size:11px}
  .ttl.sm{font-size:17px}.ttl.sm span{font-size:14px}.pbtn{font-size:20px;padding:11px 16px}.pbtn.big2{font-size:23px;padding:14px 22px}
  .nd{font-size:14px}.sbtn{height:62px;font-size:28px}.sbtn small{font-size:11px}.dgrid .sbtn{height:64px;font-size:28px}.dgrid .sbtn small{font-size:11px}.dgrid .gob{font-size:15px}
  .big{font-size:22px;padding:10px}.meter{height:26px}.mlab{font-size:13px}
  #hint{font-size:16px!important;padding:5px 14px!important}
  .tg{font-size:18px;padding:12px}
  .card h1{font-size:38px}.sub{font-size:16px}.opts button{font-size:36px}.opts button b{font-size:17px}}
</style>
</head>
<body class="inmenu">
<canvas id="c"></canvas>
<div id="ui">
  <div id="top">
    <div id="inv"></div>
    <div class="rbtns">
      <button class="rbtn" id="bMenu" aria-label="Menu">☰</button>
    </div>
  </div>
  <div id="hint"></div>
  <div id="spacer"></div>
  <div id="bottom"><div id="panel"></div><div id="tools"></div></div>
</div>
<div id="joy"><i></i></div>
<div id="floaters"></div>
<div id="toast"></div>

<div id="menu" class="overlay show">
  <div class="card mcard"><div class="mgrid"><div class="mc1">
    <h1>🏕️ Leśny Domek</h1>
    <p class="sub">Zbieraj materiały, zbuduj domek, udekoruj go i upiecz kolację przy ognisku!</p>
    <div class="lbl">Pora roku</div>
    <div class="opts" id="optSeason">
      <button data-s="summer">☀️<b>Lato</b></button>
      <button data-s="winter">❄️<b>Zima</b></button>
    </div>
    <div class="lbl">Co budujemy?</div>
    <div class="opts" id="optHouse">
      <button data-h="tree">🌳<b>Domek na drzewie</b></button>
      <button data-h="cabin">🛖<b>Chatka z bali</b></button>
    </div>
    </div><div class="mc2">
    <button id="go" class="big green" style="margin-top:10px">Ruszamy! 🪓</button>
    <button id="bInfo" class="big ghost" style="margin-top:12px">ℹ️ Informacje i licencja</button>
    <div class="ver" id="ver"></div>
  </div></div></div>
</div>

<div id="modal" class="overlay"><div class="card" id="modalBox"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const PI=Math.PI;
function easeOutBounce(x){const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375;}

/* ================= GAME DATA ================= */
const S={season:'summer',house:'tree',phase:'menu',tool:'hand',inv:{},step:0,night:0,nightT:0,collects:0,cook:null};
function drawMoss(g,cx,cy,S){const r=(a,b)=>a+Math.random()*(b-a);
  g.fillStyle='#8d9096';g.beginPath();g.ellipse(cx,cy+S*.18,S*.46,S*.2,0,0,Math.PI*2);g.fill();
  g.fillStyle='#6f7278';g.beginPath();g.ellipse(cx+S*.08,cy+S*.24,S*.36,S*.12,0,0,Math.PI);g.fill();
  const cols=['#3f6f22','#4f8a2b','#5f9e34','#76b33f','#8cc84b'];let seed=7;const rr=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  for(let k=0;k<5;k++)for(let i=0;i<9;i++){const a=Math.PI*(1.05+rr()*.9),d=rr()*S*.36;const x=cx+Math.cos(a)*d*1.15,y=cy+S*.08+Math.sin(a)*d*.75-k*S*.025;g.fillStyle=cols[k];g.beginPath();g.arc(x,y,S*(.1-k*.012),0,Math.PI*2);g.fill();}
  g.strokeStyle='#a0753a';g.lineWidth=Math.max(1,S*.018);for(let i=0;i<5;i++){const x=cx-S*.22+i*S*.11,y0=cy-S*.02-rr()*S*.05;g.beginPath();g.moveTo(x,y0);g.quadraticCurveTo(x+S*.03,y0-S*.15,x+S*.01,y0-S*.26);g.stroke();
    g.fillStyle='#8a5a28';g.beginPath();g.ellipse(x+S*.01,y0-S*.28,S*.022,S*.035,.3,0,Math.PI*2);g.fill();}}
const MOSS_URL=(()=>{const c=document.createElement('canvas');c.width=c.height=96;drawMoss(c.getContext('2d'),48,50,92);return c.toDataURL();})();
const MI=`<img class="ico" src="${MOSS_URL}" alt="mech">`;
function drawBark(g,cx,cy,S){const rr=(()=>{let sd=11;return()=>{sd=(sd*16807)%2147483647;return sd/2147483647;};})();
  g.save();g.translate(cx,cy);g.rotate(-.35);
  const w=S*.78,h=S*.34;
  // wewnętrzna strona (pomarańczowo-brązowa)
  g.fillStyle='#c98a4a';g.beginPath();g.ellipse(w*.42,0,h*.32,h*.52,0,0,Math.PI*2);g.fill();
  // biały płat kory
  g.fillStyle='#f4f1e8';g.strokeStyle='#5f594f';g.lineWidth=Math.max(1.2,S*.032);
  g.beginPath();g.moveTo(-w/2,-h/2);g.lineTo(w*.42,-h/2);g.quadraticCurveTo(w*.62,0,w*.42,h/2);g.lineTo(-w/2,h/2);g.quadraticCurveTo(-w*.56,0,-w/2,-h/2);g.closePath();g.fill();g.stroke();
  // zwinięty brzeg
  g.fillStyle='#e6e1d4';g.beginPath();g.ellipse(w*.42,0,h*.22,h*.5,0,-Math.PI/2,Math.PI/2);g.fill();g.stroke();
  g.fillStyle='#b5773c';g.beginPath();g.ellipse(w*.44,0,h*.1,h*.3,0,0,Math.PI*2);g.fill();
  // czarne przetchlinki
  g.fillStyle='#222';for(let i=0;i<9;i++){const x=-w*.42+rr()*w*.75,y=-h*.38+rr()*h*.76;g.fillRect(x,y,S*(.06+rr()*.1),S*.022);}
  g.restore();}
const BARK_URL=(()=>{const c=document.createElement('canvas');c.width=c.height=96;drawBark(c.getContext('2d'),48,48,92);return c.toDataURL();})();
const BI=`<img class="ico" src="${BARK_URL}" alt="kora">`;
function drawSticks(g,cx,cy,S){g.save();g.translate(cx,cy);g.rotate(-.55);g.lineCap='round';
  const cols=['#8b5a2b','#7a4e24','#9a6532','#86562a','#93602f'],off=[-.15,-.075,0,.075,.15];
  off.forEach((o,i)=>{const L=.4+(i%2)*.04,sh=(i%3-1)*.04;g.strokeStyle='#4a2c12';g.lineWidth=S*.085;g.beginPath();g.moveTo((-L+sh)*S,o*S);g.lineTo((L+sh)*S,o*S*.8);g.stroke();
    g.strokeStyle=cols[i];g.lineWidth=S*.058;g.beginPath();g.moveTo((-L+sh)*S,o*S);g.lineTo((L+sh)*S,o*S*.8);g.stroke();
    g.fillStyle='#ecd29a';g.beginPath();g.arc((L+sh)*S,o*S*.8,S*.026,0,Math.PI*2);g.fill();});

function W(){return S.season==='winter';}
function gH(x,z){let y=0;
  const pd=Math.hypot(x-POND.x,z-POND.z);if(pd<POND.r)y=-.4;else if(pd<POND.r+.8)y=lerp(-.4,y,(pd-POND.r)/.8);return y;}
function reserve(x,z,r){const o={x,z,r};RES.push(o);return o;}
function spotFree(x,z,r,ignorePond){for(const a of RES)if(Math.hypot(a.x-x,a.z-z)<a.r+r)return false;if(!ignorePond&&Math.hypot(x-POND.x,z-POND.z)<POND.r+.6+r)return false;for(const t of FOREST)if(Math.hypot(t[0]-x,t[1]-z)<.9+r)return false;return true;}
function findSpot(rmin,rmax,r){for(let i=0;i<120;i++){const a=Math.random()*2*PI,d=Math.sqrt(rnd(rmin*rmin,rmax*rmax)),x=Math.cos(a)*d,z=Math.sin(a)*d;if(spotFree(x,z,r))return[x,z];}return[rnd(-10,10),rnd(-13,-9)];}
function findNearPond(){for(let i=0;i<120;i++){const a=Math.random()*2*PI,d=rnd(POND.r+.9,POND.r+1.8),x=POND.x+Math.cos(a)*d,z=POND.z+Math.sin(a)*d;if(Math.hypot(x,z)<30&&spotFree(x,z,.9,true))return[x,z];}return[POND.x+4.2,POND.z-1];}

function makeGround(){
  const gg=new THREE.PlaneGeometry(170,170,90,90);gg.rotateX(-PI/2);
  const pos=gg.attributes.position,cols=[],pal=W()?['#f3f7fc','#e3ecf7','#fdfeff']:['#6db24a','#5ea43f','#82c25a'],pc=pal.map(c=>new THREE.Color(c));
  const edgeC=new THREE.Color(W()?'#eef3fa':'#66ab45'),path=new THREE.Color(W()?'#dfe7f0':'#a89060'),sand=new THREE.Color(W()?'#e6eef6':'#cdb67c'),tmp=new THREE.Color();
  for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);pos.setY(i,gH(x,z));
    const n=(Math.sin(x*.7+z*.3)+Math.sin(z*.9-x*.2)+2)/4;tmp.copy(pc[0]).lerp(n>.5?pc[2]:pc[1],Math.abs(n-.5)*2);
    const d=Math.hypot(x,z);if(d<5.5)tmp.lerp(path,(1-d/5.5)*.55);const fd=Math.hypot(x-FP.x,z-FP.z);if(fd<2.2)tmp.lerp(path,(1-fd/2.2)*.6);
    const pd=Math.hypot(x-POND.x,z-POND.z);if(pd<POND.r+1.3)tmp.lerp(sand,clamp(1-(pd-POND.r)/1.3,0,1)*.8);

    for(let i=0;i<4;i++){const lp=new THREE.Mesh(new THREE.CircleGeometry(.3,10),M('#4f9a3a'));lp.rotation.x=-PI/2;lp.position.set(POND.x+rnd(-1.8,1.8),-.1,POND.z+rnd(-1.8,1.8));world.add(lp);}}

function makeForest(){
  const list=[];
  for(let i=0;i<620;i++){for(let t=0;t<20;t++){const a=Math.random()*2*PI,d=i<260?rnd(20,62):rnd(55,165),x=Math.cos(a)*d,z=Math.sin(a)*d;if(Math.hypot(x-POND.x,z-POND.z)<POND.r+2)continue;list.push({x,z,s:rnd(.9,1.7)*(d>32?1.35:1)*(d>70?1.4:1),dec:!W()&&Math.random()<.3});if(d<36)FOREST.push([x,z]);break;}}
  for(let i=0;i<16;i++){const p=findSpot(9,15,1.4);reserve(p[0],p[1],1.3);MIDTREES.push(p);list.push({x:p[0],z:p[1],s:rnd(.8,1.3),dec:!W()&&Math.random()<.35});}
  const near=list.filter(o=>Math.hypot(o.x,o.z)<34),far=list.filter(o=>Math.hypot(o.x,o.z)>=34);
  buildTrees(near,true);buildTrees(far,false);}
function buildTrees(list,near){if(!list.length)return;
  const pines=list.filter(o=>!o.dec),decs=list.filter(o=>o.dec);const dm=new THREE.Object3D();const FM=near?null:farMats();
  const trunkG=new THREE.CylinderGeometry(.18,.28,1,6);trunkG.translate(0,.5,0);
  const tr=new THREE.InstancedMesh(trunkG,near?MT.trunk:FM.trunk,list.length);
  list.forEach((o,i)=>{dm.position.set(o.x,gH(o.x,o.z)-.1,o.z);dm.rotation.set(0,0,0);dm.scale.set(o.s,(o.dec?2.6:1.6)*o.s,o.s);dm.updateMatrix();tr.setMatrixAt(i,dm.matrix);});
  tr.castShadow=near;world.add(tr);
  const coneG=new THREE.ConeGeometry(1,1,7);coneG.translate(0,.5,0);
  const pm=near?(W()?MT.pineW:MT.pine):(W()?FM.pineW:FM.pine);
  for(let k=0;k<3;k++){if(!pines.length)break;const im=new THREE.InstancedMesh(coneG,pm[k],pines.length);const sn=W()&&pines.length?new THREE.InstancedMesh(coneG,near?MT.snowT:FM.snow,pines.length):null;
    pines.forEach((o,i)=>{const r=(1.5-.36*k)*o.s,h=(1.9-.2*k)*o.s,y=gH(o.x,o.z)+(1.1+k*1.05)*o.s,ry=Math.random()*6;
      dm.position.set(o.x,y,o.z);dm.rotation.set(0,ry,0);dm.scale.set(r,h,r);dm.updateMatrix();im.setMatrixAt(i,dm.matrix);
      if(sn){dm.position.set(o.x,y+h*.48,o.z);dm.scale.set(r*.6,h*.52,r*.6);dm.updateMatrix();sn.setMatrixAt(i,dm.matrix);}});
    im.castShadow=near;world.add(im);if(sn)world.add(sn);}
  if(decs.length){const ig=new THREE.IcosahedronGeometry(1,0);const lm=near?occl(new THREE.MeshLambertMaterial({color:'#ffffff'})):new THREE.MeshLambertMaterial({color:'#ffffff'});const im=new THREE.InstancedMesh(ig,lm,decs.length*2);const c=new THREE.Color();
    decs.forEach((o,i)=>{const base=gH(o.x,o.z)+2.4*o.s;for(let j=0;j<2;j++){dm.position.set(o.x+rnd(-.3,.3),base+j*.9*o.s,o.z+rnd(-.3,.3));dm.rotation.set(rnd(0,3),rnd(0,3),0);const r=(1.5-j*.4)*o.s;dm.scale.set(r,r*.9,r);dm.updateMatrix();im.setMatrixAt(i*2+j,dm.matrix);c.setHSL(rnd(.24,.31),rnd(.45,.6),rnd(.3,.42));im.setColorAt(i*2+j,c);}});
    im.instanceColor.needsUpdate=true;im.castShadow=near;world.add(im);}
}

const ASR=44100,SND={};
const nzA=n=>{const a=new Float32Array(n);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;return a;};
const alen=s=>new Float32Array(Math.max(1,Math.floor(s*ASR)));
function flp(a,fc){const k=1-Math.exp(-2*PI*fc/ASR);let y=0;for(let i=0;i<a.length;i++){y+=k*(a[i]-y);a[i]=y;}return a;}
function fhp(a,fc){const k=1-Math.exp(-2*PI*fc/ASR);let y=0;for(let i=0;i<a.length;i++){y+=k*(a[i]-y);a[i]-=y;}return a;}
function fbp(a,f,q){const w=2*PI*f/ASR,al=Math.sin(w)/(2*q),a0=1+al,a1=-2*Math.cos(w),a2=1-al;let x1=0,x2=0,y1=0,y2=0;
  for(let i=0;i<a.length;i++){const x=a[i],y=(al*x-al*x2-a1*y1-a2*y2)/a0;x2=x1;x1=x;y2=y1;y1=y;a[i]=y;}return a;}
function fenv(a,att,dec){for(let i=0;i<a.length;i++){const t=i/ASR;a[i]*=Math.min(1,t/Math.max(att,1e-4))*Math.exp(-Math.max(0,t-att)/dec);}return a;}
function modal(a,modes,off=0){const o=Math.floor(off*ASR);for(const[f,d,g]of modes){const w=2*PI*f/ASR,ph=Math.random()*6;for(let i=0;o+i<a.length;i++){const e=Math.exp(-i/ASR/d);if(e<1e-4)break;a[o+i]+=g*e*Math.sin(w*i+ph);}}return a;}
function amix(d,s,off=0,g=1){const o=Math.floor(off*ASR);for(let i=0;i<s.length&&o+i<d.length;i++)d[o+i]+=s[i]*g;return d;}
function anorm(a,p=.8){let m=0;for(let i=0;i<a.length;i++)m=Math.max(m,Math.abs(a[i]));if(m>0)for(let i=0;i<a.length;i++)a[i]*=p/m;const f=Math.min(a.length,256);for(let i=0;i<f;i++)a[a.length-1-i]*=i/f;return a;}
function atone(a,o,d,f0,f1,g,vib=0){const n0=Math.floor(o*ASR),N=Math.floor(d*ASR);let ph=0;for(let i=0;i<N&&n0+i<a.length;i++){const u=i/N,f=f0+(f1-f0)*u+vib*f0*.03*Math.sin(2*PI*35*i/ASR);ph+=2*PI*f/ASR;a[n0+i]+=g*Math.pow(Math.sin(PI*u),.8)*(Math.sin(ph)+.08*Math.sin(2*ph));}return a;}
function bubbles(a,n,t0,t1,fmin,fmax,g,dec){for(let k=0;k<n;k++){const f0=rnd(fmin,fmax),o=Math.floor(rnd(t0,t1)*ASR);for(let i=0;o+i<a.length;i++){const t=i/ASR,e=Math.exp(-t/dec);if(e<1e-3)break;a[o+i]+=g*e*Math.sin(2*PI*f0*(t+t*t*7));}}return a;}

  chop(){const a=alen(.45),f=rnd(135,185);modal(a,[[f,.07,1],[f*2.31,.045,.6],[f*4.1,.025,.45],[f*6.7,.012,.3],[f*9.4,.007,.2]]);

  saw(){const d=.4,a=alen(d),nn=fbp(nzA(a.length),rnd(2200,3000),1.5),r=rnd(55,75);

  snap(){const a=alen(.12);amix(a,fenv(fhp(nzA(300),900),0,.004),0,1);modal(a,[[rnd(900,1300),.012,.6],[rnd(2000,2600),.007,.35]]);return anorm(a,.6);},

  crackle(){const a=alen(.06);amix(a,fenv(fbp(nzA(a.length),rnd(1400,5000),rnd(3,8)),0,rnd(.003,.012)),0,1);return anorm(a,rnd(.35,.8));},
  spark(){const a=alen(.12),nn=fhp(nzA(a.length),4500);for(let i=0;i<a.length;i++)a[i]=nn[i]*Math.exp(-i/ASR/.025);for(let k=0;k<5;k++)amix(a,fenv(fbp(nzA(200),rnd(3000,7000),5),0,.003),rnd(0,.06),.5);return anorm(a,.45);},

const VARI={chop:4,hammer:4,saw:3,cut:3,snap:3,stones:4,rustle:3,dig:3,pop:2,stepGrass:6,stepSnow:6,stepWood:5,stepSand:5,swish:2,plop:3,splash:2,crackle:8,spark:3,whoosh:1,sizzle:1,bite:3,tit:3,chaff:2,robin:3,sparrow:2,woodpecker:2,cricket:3,frog:2,owl:2};
function genOne(k){if(!SND[k])SND[k]=[];while(SND[k].length<VARI[k])SND[k].push(GEN[k]());return SND[k];}
const genQ=[];for(const k in VARI)for(let i=0;i<VARI[k];i++)genQ.push(k);

function auInit(){if(AU.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.gain.value=SAVE.sound===false?0:.85;AU.master.connect(AU.ctx.destination);AU.bufs={};AU.sizzle=null;}catch(e){AU.ctx=null;}}

function snd(name,vol=1,pan,rate){const c=AU.ctx;if(!c||c.state!=='running'||SAVE.sound===false||!VARI[name])return null;const v=genOne(name),i=Math.floor(Math.random()*v.length),key=name+i;
  let b=AU.bufs[key];if(!b){b=c.createBuffer(1,v[i].length,ASR);b.getChannelData(0).set(v[i]);AU.bufs[key]=b;}
  const s=c.createBufferSource();s.buffer=b;s.playbackRate.value=rate||rnd(.94,1.06);const g=c.createGain();g.gain.value=vol;s.connect(g);let o=g;
  if(pan!==undefined&&c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=clamp(pan,-1,1);g.connect(p);o=p;}o.connect(AU.master);s.start();return{s,g};}

  const pan=d>.5?(dx*Math.cos(cam.theta)-dz*Math.sin(cam.theta))/d*.8:0;snd(name,g,pan);}

const FISHT=[{n:'okonia',c:'#7f9c3c',fin:'#d8653a',st:'#2f3f1a'},{n:'płotkę',c:'#c9ced6',fin:'#d8453a'},{n:'pstrąga',c:'#8fa08e',fin:'#9aa38e',sp:'#3a3a3a'},{n:'karasia',c:'#c9a23a',fin:'#b0862a'}];
function mkFishMesh(t,bodyMat){const g=new THREE.Group(),bm=bodyMat||M(t.c),fm=M(t.fin||t.c);const b=sph(.1,bm,0,0,0,12,8);b.scale.set(.6,.85,2.2);g.add(b);
  const tl=new THREE.Mesh(new THREE.ConeGeometry(.09,.14,4),fm);tl.rotation.x=-PI/2;tl.scale.x=.25;tl.position.z=-.27;g.add(tl);
  const df=new THREE.Mesh(new THREE.ConeGeometry(.045,.12,3),fm);df.position.set(0,.09,-.02);df.scale.z=2;g.add(df);
  for(const sx of[-1,1]){g.add(sph(.016,MT.dark,sx*.05,.025,.15,6,5));const pf=box(.005,.03,.06,fm);pf.position.set(sx*.06,-.03,.06);pf.rotation.y=sx*.4;g.add(pf);}
  if(t.st)for(const z of[-.09,0,.09]){const s=box(.125,.12,.025,M(t.st));s.position.z=z;g.add(s);}
  if(t.sp)for(let i=0;i<10;i++){const sx=Math.random()<.5?-1:1;g.add(sph(.008,M(t.sp),sx*.058,rnd(-.03,.05),rnd(-.15,.12),4,3));}
  return g;}
function startFishing(){if(S.phase==='menu'||FISH||P.climb)return;const C=S.cook;
  if(C&&['build','ignite','cook','result'].includes(C.stage)){toast('Najpierw skończ to, co robisz przy ognisku 🙂');return;}
  const dx=P.pos.x-POND.x,dz=P.pos.z-POND.z,d=Math.hypot(dx,dz)||1,ux=dx/d,uz=dz/d;
  FISH={stage:'walk',t:0,shore:{x:POND.x+ux*(POND.r+.75),z:POND.z+uz*(POND.r+.75)},target:V(POND.x+ux*(POND.r-1.3),-.1,POND.z+uz*(POND.r-1.3))};
  P.goal={x:FISH.shore.x,z:FISH.shore.z,level:0,face:Math.atan2(-ux,-uz),then:()=>{if(FISH&&FISH.stage==='walk')castLine();}};
  marker(V(FISH.shore.x,0,FISH.shore.z));toast('🎣 Idziesz łowić ryby!');}
function castLine(){snd('swish',.5);const F=FISH;F.stage='cast';F.t=0;
  if(!F.bob){F.bob=new THREE.Group();const top=new THREE.Mesh(new THREE.SphereGeometry(.055,10,6,0,2*PI,0,PI/2),BM('#e8452f'));const bot=new THREE.Mesh(new THREE.SphereGeometry(.055,10,6,0,2*PI,PI/2,PI/2),BM('#ffffff'));F.bob.add(top,bot);world.add(F.bob);
    const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(6),3));F.line=new THREE.Line(lg,new THREE.LineBasicMaterial({color:'#2a2a2a'}));F.line.frustumCulled=false;world.add(F.line);}
  if(W()&&!world.userData.hole){const h=new THREE.Mesh(new THREE.CircleGeometry(.38,20),BM('#1c3346'));h.rotation.x=-PI/2;h.position.copy(F.target).setY(-.115);world.add(h);
    for(let i=0;i<7;i++){const a=i/7*2*PI;const c=box(.14,.06,.1,MT.snow);c.position.set(F.target.x+Math.cos(a)*.45,-.09,F.target.z+Math.sin(a)*.45);c.rotation.y=a;world.add(c);}world.userData.hole=1;toast('❄️ Wyrąbujesz przerębel w lodzie i zarzucasz wędkę!');}
  renderPanel();}
function endFishing(msg){if(!FISH)return;if(FISH.bob)world.remove(FISH.bob);if(FISH.line)world.remove(FISH.line);if(FISH.fishM)world.remove(FISH.fishM);FISH=null;P.rodTip=null;if(msg)toast(msg);renderPanel();}
const fishTmp=V(0,0,0);
function updateFish(dt){const F=FISH;if(!F||!world)return;
  if(F.stage==='walk'){if(!P.goal&&!P.climb){if(Math.hypot(P.pos.x-F.shore.x,P.pos.z-F.shore.z)<.7)castLine();else endFishing('Nie udało się dojść do wody.');}return;}
  if(Math.hypot(joy.x,joy.y)>.15||keys.w||keys.a||keys.s||keys.d||P.goal){endFishing();return;}
  F.t+=dt;const tip=P.rodTip?P.rodTip.getWorldPosition(fishTmp):P.pos.clone().add(V(0,2,0));
  if(F.stage==='cast'){const k=clamp((F.t-.3)/.6,0,1);const p=tip.clone().lerp(F.target,k);p.y+=Math.sin(k*PI)*1.2;F.bob.position.copy(p);
    if(F.t>=.9){F.stage='wait';F.t=0;F.wait=rnd(2.5,6);snd('plop',.55);burst(F.target.clone().add(V(0,.05,0)),'#cfeaff',6,1.2,.5,true,5);renderPanel();}}
  else if(F.stage==='wait'){F.bob.position.set(F.target.x,F.target.y+Math.sin(T*2)*.015,F.target.z);if(F.t>F.wait){F.stage='bite';F.t=0;snd('plop',.4);renderPanel();}}
  else if(F.stage==='bite'){F.bob.position.set(F.target.x,F.target.y-.03-Math.abs(Math.sin(F.t*13))*.07,F.target.z);if(Math.random()<dt*8)burst(F.target.clone().add(V(0,.03,0)),'#cfeaff',2,1,.4,true,5);if(Math.random()<dt*3)
    if(F.t>1.5){F.stage='wait';F.t=0;F.wait=rnd(2,5);toast('Ryba zjadła przynętę i uciekła 🐟💨 Czekaj na następną!');renderPanel();}}
  else if(F.stage==='catch'){const k=Math.min(1,F.t/.8),end=P.pos.clone().add(V(0,1.3,0));const p=F.target.clone().lerp(end,k);p.y+=Math.sin(k*PI)*1.4;F.fishM.position.copy(p);F.fishM.rotation.z=Math.sin(F.t*25)*.5;F.bob.position.copy(F.target);
    if(k>=1){world.remove(F.fishM);F.fishM=null;give({fish:1},end.clone().add(V(0,.5,0)));castLine();}}
  const a=F.line.geometry.attributes.position.array;a[0]=tip.x;a[1]=tip.y;a[2]=tip.z;a[3]=F.bob.position.x;a[4]=F.bob.position.y+.04;a[5]=F.bob.position.z;F.line.geometry.attributes.position.needsUpdate=true;}
